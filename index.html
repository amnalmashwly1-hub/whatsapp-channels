<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل قنوات واتساب 2026 | الجوكر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #25D366; --dark: #0b141a; --admin: #34b7f1; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(rgba(11,20,26,0.9), rgba(11,20,26,0.9)), url('IMG-20251128-WA0004(1).jpg'); background-size: cover; background-attachment: fixed; color: #fff; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .menu-dots { font-size: 24px; cursor: pointer; color: var(--primary); }
        #admin-panel { display: none; background: #1c2c33; padding: 20px; border-radius: 15px; margin: 20px 0; border: 1px solid var(--admin); }
        .admin-input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #34495e; background: #0b141a; color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: rgba(255,255,255,0.08); padding: 15px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .card img { width: 100%; height: 160px; object-fit: cover; border-radius: 15px; margin-bottom: 12px; }
        .btn-pub { width: 100%; padding: 12px; background: var(--primary); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; color: #000; }
        #status { margin-top: 10px; font-size: 0.9rem; color: #ff4d4d; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <h1>🌟 دليل الجوكر</h1>
        <div class="menu-dots" onclick="adminAuth()">⋮</div>
    </div>

    <div id="admin-panel">
        <h3>🛠️ إدارة المحتوى الفوري</h3>
        <p style="font-size:0.8rem; color:#64748b;">المشرف: almashwlyamyn@gmail.com</p>
        
        <div style="border: 2px dashed var(--admin); padding: 15px; text-align: center; margin: 15px 0; border-radius: 10px;">
            <input type="file" id="imgFile" accept="image/*">
        </div>

        <input type="text" id="chTitle" class="admin-input" placeholder="عنوان القناة">
        <input type="text" id="chLink" class="admin-input" placeholder="رابط القناة">
        
        <button class="btn-pub" onclick="uploadAndPublish()">رفع ونشر الآن 🚀</button>
        <div id="status"></div>
    </div>

    <div class="grid" id="channelsGrid">
        </div>
    
    <footer style="text-align:center; padding:50px; color:#64748b;">
        <p>جميع الحقوق محفوظة للجوكر 👨‍🦯 &copy; 2026</p>
    </footer>
</div>

<script>
    // تأكد أن هذا الـ Token هو الذي نسخته ghp_...
    const CONFIG = {
        token: "Ghp_SaoVkF2Td6IYyQV3Gtkq33XMiWnMBB0FnojB",
        repo: "amnalmashwly1/whatsapp-channels", // تم تصحيح المسار بناءً على صورك
        userMail: "almashwlyamyn@gmail.com"
    };

    function adminAuth() {
        const mail = prompt("أدخل بريد المشرف:");
        if(mail === CONFIG.userMail) {
            document.getElementById('admin-panel').style.display = 'block';
        } else {
            alert("غير مسموح!");
        }
    }

    async function uploadAndPublish() {
        const fileInput = document.getElementById('imgFile');
        const title = document.getElementById('chTitle').value;
        const link = document.getElementById('chLink').value;
        const status = document.getElementById('status');

        if(!fileInput.files[0] || !title || !link) return alert("أكمل البيانات!");

        status.style.color = "#34b7f1";
        status.innerText = "جاري الاتصال بـ GitHub... ⏳";
        
        const file = fileInput.files[0];
        const fileName = `IMG_${Date.now()}.jpg`;
        const reader = new FileReader();

        reader.onload = async function() {
            const content = reader.result.split(',')[1];
            
            try {
                const response = await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/${fileName}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${CONFIG.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `New Channel: ${title}`,
                        content: content
                    })
                });

                if(response.ok) {
                    status.style.color = "#25D366";
                    status.innerText = "تم النشر بنجاح! ✅";
                    location.reload(); // تحديث لمشاهدة القناة الجديدة
                } else {
                    const err = await response.json();
                    status.innerText = "فشل: " + (err.message || "خطأ غير معروف");
                }
            } catch (error) {
                status.innerText = "خطأ في الشبكة!";
            }
        };
        reader.readAsDataURL(file);
    }
</script>
</body>
</html>
