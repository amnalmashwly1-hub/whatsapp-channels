<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل قنوات واتساب 2026 | الجوكر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #25D366; --dark: #0b141a; --admin: #34b7f1; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(rgba(11,20,26,0.9), rgba(11,20,26,0.9)), url('IMG-20251128-WA0004(1).jpg'); background-size: cover; background-attachment: fixed; color: #fff; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .menu-dots { font-size: 24px; cursor: pointer; color: var(--primary); }
        
        /* لوحة الإدارة */
        #admin-panel { display: none; background: #1c2c33; padding: 20px; border-radius: 15px; margin: 20px 0; border: 1px solid var(--admin); box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .admin-input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #34495e; background: #0b141a; color: #fff; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: rgba(255,255,255,0.08); padding: 15px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .card img { width: 100%; height: 160px; object-fit: cover; border-radius: 15px; margin-bottom: 12px; }
        .btn-pub { width: 100%; padding: 12px; background: var(--primary); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; color: #000; }
        .status-msg { margin-top: 10px; font-size: 0.9rem; color: #34b7f1; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <h1>🌟 دليل الجوكر</h1>
        <div class="menu-dots" onclick="adminAuth()">⋮</div>
    </div>

    <div id="admin-panel">
        <h3>🛠️ إدارة المحتوى الفوري</h3>
        <p style="font-size:0.8rem; color:#64748b;">مرحباً almashwlyamyn@gmail.com</p>
        
        <div style="border: 2px dashed var(--admin); padding: 15px; text-align: center; margin: 15px 0; border-radius: 10px;">
            <p>اختر صورة القناة (سيتم رفعها لـ GitHub)</p>
            <input type="file" id="imgFile" accept="image/*" style="margin-top:10px;">
        </div>

        <input type="text" id="chTitle" class="admin-input" placeholder="عنوان القناة">
        <input type="text" id="chLink" class="admin-input" placeholder="رابط القناة (واتساب)">
        
        <button class="btn-pub" onclick="uploadAndPublish()">رفع الصورة ونشر القناة 🚀</button>
        <div id="status" class="status-msg"></div>
    </div>

    <div class="grid" id="channelsGrid">
        </div>
    
    <footer style="text-align:center; padding:50px; color:#64748b;">
        <p>جميع الحقوق محفوظة للجوكر 👨‍🦯 &copy; 2026</p>
    </footer>
</div>

<script>
    const CONFIG = {
        token: "Ghp_SaoVkF2Td6IYyQV3Gtkq33XMiWnMBB0FnojB",
        repo: "amnalmashwly1-hub/whatsapp-channels", // مسار مستودعك
        userMail: "almashwlyamyn@gmail.com"
    };

    function adminAuth() {
        const mail = prompt("أدخل بريد المشرف:");
        if(mail === CONFIG.userMail) {
            document.getElementById('admin-panel').style.display = 'block';
            alert("تم تفعيل صلاحيات الجوكر!");
        } else {
            alert("غير مسموح!");
        }
    }

    async function uploadAndPublish() {
        const fileInput = document.getElementById('imgFile');
        const title = document.getElementById('chTitle').value;
        const link = document.getElementById('chLink').value;
        const status = document.getElementById('status');

        if(!fileInput.files[0] || !title || !link) {
            return alert("يرجى إكمال جميع البيانات!");
        }

        status.innerText = "جاري رفع الصورة إلى GitHub... ⏳";
        
        const file = fileInput.files[0];
        const fileName = `IMG_${Date.now()}_${file.name}`;
        const reader = new FileReader();

        reader.onload = async function() {
            const content = reader.result.split(',')[1];
            
            try {
                // 1. رفع الصورة إلى GitHub API
                const response = await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/${fileName}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${CONFIG.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Upload ${fileName} via Joker Panel`,
                        content: content
                    })
                });

                if(response.ok) {
                    status.innerText = "تم الرفع بنجاح! جاري تحديث الموقع... ✅";
                    // إضافة القناة للواجهة فوراً
                    addCardToUI(title, fileName, link);
                    alert("تم النشر بنجاح!");
                } else {
                    status.innerText = "فشل الرفع. تأكد من إعدادات المستودع.";
                }
            } catch (error) {
                status.innerText = "خطأ في الاتصال!";
            }
        };
        reader.readAsDataURL(file);
    }

    function addCardToUI(title, imgName, link) {
        const grid = document.getElementById('channelsGrid');
        const card = `
            <div class="card">
                <img src="${imgName}">
                <h3>${title}</h3>
                <a href="${link}" class="btn-pub" style="text-decoration:none; display:inline-block;">انضم الآن</a>
            </div>`;
        grid.innerHTML = card + grid.innerHTML;
    }
</script>
</body>
</html>
