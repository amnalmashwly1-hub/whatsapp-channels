<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل قنوات واتساب 2026 | الجوكر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #25D366; --dark: #0b141a; --glass: rgba(255, 255, 255, 0.08); --admin: #34b7f1; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(rgba(11, 20, 26, 0.9), rgba(11, 20, 26, 0.9)), url('IMG-20251128-WA0004(1).jpg'); background-size: cover; background-attachment: fixed; color: #fff; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* زر الثلاث نقاط السري */
        .top-nav { display: flex; justify-content: flex-end; padding: 10px; position: sticky; top: 0; z-index: 1000; }
        .menu-dots { font-size: 24px; cursor: pointer; padding: 10px; color: var(--primary); transition: 0.3s; }
        .menu-dots:hover { transform: rotate(90deg); }

        /* نافذة تسجيل الدخول */
        .login-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center; }
        .login-content { background: #1c2c33; padding: 40px; border-radius: 20px; text-align: center; border: 1px solid var(--primary); width: 90%; max-width: 400px; }

        /* لوحة المسؤول المنسدلة */
        #admin-hub { display: none; background: #1c2c33; padding: 20px; border-radius: 15px; border: 2px solid var(--admin); margin-bottom: 30px; }
        .admin-form input, .admin-form select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #34495e; background: #0b141a; color: #fff; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: var(--glass); border-radius: 20px; padding: 15px; text-align: center; transition: 0.3s; position: relative; }
        .card img { width: 100%; height: 160px; object-fit: cover; border-radius: 15px; margin-bottom: 12px; }
        .admin-tools { display: none; position: absolute; top: 5px; right: 5px; }
        
        .btn { display: block; background: var(--primary); color: #000; padding: 10px; border-radius: 12px; text-decoration: none; font-weight: bold; }
        footer { text-align: center; padding: 60px; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <div class="menu-dots" onclick="openGate()">⋮</div>
    </div>

    <div id="gate" class="login-modal">
        <div class="login-content">
            <h2 style="color:var(--primary)">بوابة الجوكر 👨‍🦯</h2>
            <p style="font-size: 0.8rem; color: #64748b; margin-bottom: 20px;">تأكيد هوية المشرف فقط</p>
            <input type="email" id="admin-mail" placeholder="ادخل البريد المعتمد" style="width:100%; padding:12px; border-radius:10px; margin-bottom:15px;">
            <button onclick="verifyGate()" style="width:100%; padding:12px; background:var(--primary); border:none; border-radius:10px; font-weight:bold; cursor:pointer;">تأكيد</button>
            <button onclick="closeGate()" style="background:none; border:none; color:#64748b; margin-top:15px; cursor:pointer;">إلغاء</button>
        </div>
    </div>

    <div id="admin-hub">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h3 style="color:var(--admin)">📊 الإدارة والإحصائيات</h3>
            <button onclick="location.reload()" style="background:#e74c3c; color:white; border:none; padding:5px 15px; border-radius:8px;">خروج</button>
        </div>
        
        <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px; text-align:center;">
            <div style="background:var(--glass); padding:10px; border-radius:10px;"><h4>1,620</h4><p style="font-size:0.7rem">زيارة</p></div>
            <div style="background:var(--glass); padding:10px; border-radius:10px;"><h4>412</h4><p style="font-size:0.7rem">نقرة</p></div>
            <div style="background:var(--glass); padding:10px; border-radius:10px;"><h4>18</h4><p style="font-size:0.7rem">قناة</p></div>
        </div>

        <div class="admin-form">
            <h4 style="margin-bottom:10px;">➕ إضافة قناة جديدة</h4>
            <input type="text" id="new-name" placeholder="اسم القناة">
            <input type="text" id="new-img" placeholder="اسم ملف الصورة (مثال: IMG-2025...)">
            <input type="text" id="new-url" placeholder="رابط القناة">
            <button onclick="addChannel()" style="width:100%; padding:12px; background:var(--admin); border:none; border-radius:10px; color:#fff; font-weight:bold;">نشر الآن</button>
        </div>
    </div>

    <header><h1>🌟 دليل قنوات واتساب 2026</h1><p>بإشراف الجوكر</p></header>

    <div class="grid" id="main-grid">
        <div class="card">
            <div class="admin-tools"><button style="background:red; color:white; border:none; padding:2px 8px; border-radius:5px;">حذف</button></div>
            <img src="IMG-20251127-WA0012(1).jpg">
            <h3>نكت وصور مضحكة</h3>
            <a href="https://whatsapp.com/channel/0029VaFDOVyGE56kJdojZ21y" class="btn">انضم الآن</a>
        </div>
        </div>

    <footer><p>جميع الحقوق محفوظة <span style="color:var(--primary); font-weight:bold;">للجوكر 👨‍🦯</span> &copy; 2026</p></footer>
</div>

<script>
    function openGate() { document.getElementById('gate').style.display = 'flex'; }
    function closeGate() { document.getElementById('gate').style.display = 'none'; }

    function verifyGate() {
        const mail = document.getElementById('admin-mail').value;
        if(mail === "almashwlyamyn@gmail.com") {
            alert("مرحباً بك يا جوكر. تم تفعيل وضع المشرف.");
            document.getElementById('gate').style.display = 'none';
            document.getElementById('admin-hub').style.display = 'block';
            document.querySelectorAll('.admin-tools').forEach(t => t.style.display = 'block');
        } else {
            alert("البريد غير مصرح له!");
        }
    }

    function addChannel() {
        const name = document.getElementById('new-name').value;
        const img = document.getElementById('new-img').value;
        const url = document.getElementById('new-url').value;
        if(name && img && url) {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = `<div class="card"><div class="admin-tools" style="display:block"><button style="background:red; color:white; border:none; padding:2px 8px; border-radius:5px;">حذف</button></div><img src="${img}"><h3>${name}</h3><a href="${url}" class="btn">انضم الآن</a></div>` + grid.innerHTML;
            alert("تمت الإضافة بنجاح!");
        }
    }
</script>
</body>
</html>
